name: Apply database migrations (hosted Supabase)

# Applies supabase/migrations to the hosted project after changes land on main.
# Needs repository secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_REF.
# If any is missing the job reports that and exits successfully, so forks and fresh repos stay green.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/deploy-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Check that the Supabase secrets are configured
        id: secrets
        run: |
          missing=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -z "$SUPABASE_DB_PASSWORD" ] && missing="$missing SUPABASE_DB_PASSWORD"
          [ -z "$SUPABASE_PROJECT_REF" ] && missing="$missing SUPABASE_PROJECT_REF"
          if [ -n "$missing" ]; then
            echo "::notice title=Migrations not applied::Missing repository secrets:$missing. See docs/build/milestone-1-setup.md."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.configured == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.configured == 'true'
        with:
          version: 3.1.0
      - name: Show local vs hosted migrations
        if: steps.secrets.outputs.configured == 'true'
        run: supabase migration list --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Apply pending migrations
        if: steps.secrets.outputs.configured == 'true'
        # --skip-vault: Vault secrets (worker URL, cron secret) are set by the owner in the dashboard, not from config.
        # --yes: the CLI asks for confirmation before changing a production project, and CI cannot answer.
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --skip-vault --yes
